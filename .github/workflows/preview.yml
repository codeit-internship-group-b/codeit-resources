name: preview-url

permissions:
  pull-requests: write
  contents: read

on:
  pull_request:
    branches: [develop]
    types: [opened, synchronize, reopened]

jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - name: Git Checkout
        uses: actions/checkout@v4

      - name: Check git status
        run: |
          echo "Current branch and commit:"
          git branch
          git rev-parse HEAD
          echo "Last commit message:"
          git log -1 --pretty=%B

      - name: Check PR changes
        run: |
          echo "DashboardSection content:"
          cat apps/web/app/dashboard/_components/DashboardSection.tsx

      - name: Check AuthGuard content
        run: |
          echo "Looking for AuthGuard.tsx:"
          find . -name "AuthGuard.tsx"

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 8.15.6

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20.x"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install

      - name: Generate Environment Variables File
        run: |
          echo "NEXT_PUBLIC_API_URL=$NEXT_PUBLIC_API_URL" >> apps/web/.env.production.local
        env:
          NEXT_PUBLIC_API_URL: ${{ secrets.NEXT_PUBLIC_API_URL }}

      - name: Build with debug
        run: |
          echo "Current branch: ${{ github.head_ref }}"
          echo "PR number: ${{ github.event.pull_request.number }}"
          echo "Event name: ${{ github.event_name }}"
          pnpm -filter=web build
          echo "Checking dashboard directory contents:"
          ls -la ${{ secrets.BUILD_DIRECTORY }}/_next/static/chunks/app/dashboard/
          echo "Checking all dashboard related files:"
          find ${{ secrets.BUILD_DIRECTORY }} -name "*dashboard*"
        env:
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          GITHUB_EVENT_NUMBER: ${{ github.event.pull_request.number }}

      - name: Check build output
        run: |
          echo "Checking index.html content:"
          cat ${{ secrets.BUILD_DIRECTORY }}/index.html

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Deploy to S3 with PR-specific prefix
        run: |
          echo "Syncing files to S3..."
          aws s3 sync ${{ secrets.BUILD_DIRECTORY }} s3://${{ secrets.AWS_S3_BUCKET_NAME }}/pr-${{ github.event.pull_request.number }} --delete
          echo "Files uploaded to S3:"
          aws s3 ls s3://${{ secrets.AWS_S3_BUCKET_NAME }}/pr-${{ github.event.pull_request.number }} --recursive

      - name: CloudFront Invalidate Cache
        run: aws cloudfront create-invalidation --distribution-id ${{ secrets.AWS_CLOUDFRONT_DISTRIBUTION_ID }} --paths "/pr-${{ github.event.pull_request.number }}/*"

      - name: Add Preview URL as a Comment
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          message: |
            ## 🚀 Preview URL

            **Branch:** ${{ github.head_ref }}
            **Commit:** ${{ github.sha }}

            Preview URL: https://codeit.click?pr=${{ github.event.pull_request.number }}
